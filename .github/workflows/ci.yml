name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The whole module targets Windows (internal/winsvc is `//go:build
    # windows`-only), so every step must cross-compile for windows/amd64 —
    # otherwise packages that import winsvc resolve to zero source files on
    # the Linux runner's native GOOS.
    env:
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
